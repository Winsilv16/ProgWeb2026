{% extends 'base.html' %}

{% block title %}Editar Produto{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Editar Produto</h2>

    <form method="POST">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="Produto" class="form-label">Nome do Produto</label>
            <input type="text" class="form-control" id="Produto" name="Produto" value="{{ produto.Produto }}" required>
        </div>

        <div class="mb-3">
            <label for="preco" class="form-label">Preço</label>
            <input type="number" step="0.01" class="form-control" id="preco" name="preco" value="{{ produto.preco }}" required>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="promocao" name="promocao" {% if produto.promocao %}checked{% endif %}>
            <label class="form-check-label" for="promocao">Em Promoção</label>
        </div>

        <div class="mb-3">
            <label for="categoria" class="form-label">Categoria</label>
            <select class="form-select" id="categoria" name="categoria">
                {% for categoria in categorias %}
                    <option value="{{ categoria.id }}" {% if produto.categoria.id == categoria.id %}selected{% endif %}>
                        {{ categoria.nome }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="fabricante" class="form-label">Fabricante</label>
            <select class="form-select" id="fabricante" name="fabricante">
                {% for fabricante in fabricantes %}
                    <option value="{{ fabricante.id }}" {% if produto.fabricante.id == fabricante.id %}selected{% endif %}>
                        {{ fabricante.nome }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-success">Salvar Alterações</button>
        <a href="/produto/" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
