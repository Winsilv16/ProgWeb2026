{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Minha Loja{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    {% block styles %}{% endblock %}
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light justify-content-end px-4">
            <ul class="nav">
                <li class="nav-item">
                    <a class="nav-link" href="/"><i class="fa fa-home"></i> Home</a>
                </li>
                
                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="/usuario"><i class="fa fa-user"></i> {{ user.username }}</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-danger" href="/logout"><i class="fa fa-sign-out"></i> Sair</a>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="/login"><i class="fa fa-sign-in"></i> Entrar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/register"><i class="fa fa-edit"></i> Registrar</a>
                    </li>
                {% endif %}
            </ul>
        </nav>
    </header>

    <div class="container my-4">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
