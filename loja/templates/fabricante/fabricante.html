<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Fabricantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2>Lista de Fabricantes</h2>
    <a href="{% url 'add_fabricante' %}" class="btn btn-primary mb-3">Novo Fabricante</a>
    <table class="table table-bordered">
        <thead>
            <tr><th>ID</th><th>Nome</th><th>Site</th><th>Ações</th></tr>
        </thead>
        <tbody>
            {% for f in fabricantes %}
            <tr>
                <td>{{ f.id }}</td>
                <td>{{ f.nome }}</td>
                <td><a href="{{ f.site }}" target="_blank">{{ f.site }}</a></td>
                <td>
                    <a href="{% url 'edit_fabricante' f.id %}" class="btn btn-sm btn-warning">Editar</a>
                    <a href="{% url 'delete_fabricante' f.id %}" class="btn btn-sm btn-danger">Excluir</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
