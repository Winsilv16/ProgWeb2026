<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Excluir Fabricante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5" style="max-width: 500px;">
    <div class="alert alert-danger">
        <p>Tem certeza que deseja excluir o fabricante <strong>{{ fabricante.nome }}</strong>?</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Confirmar Exclusão</button>
            <a href="{% url 'list_fabricante' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
