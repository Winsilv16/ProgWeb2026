<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Categorias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2>Lista de Categorias</h2>
    <a href="{% url 'add_categoria' %}" class="btn btn-primary mb-3">Nova Categoria</a>
    <table class="table table-bordered">
        <thead>
            <tr><th>ID</th><th>Nome</th><th>Ações</th></tr>
        </thead>
        <tbody>
            {% for c in categorias %}
            <tr>
                <td>{{ c.id }}</td>
                <td>{{ c.nome }}</td>
                <td>
                    <a href="{% url 'edit_categoria' c.id %}" class="btn btn-sm btn-warning">Editar</a>
                    <a href="{% url 'delete_categoria' c.id %}" class="btn btn-sm btn-danger">Excluir</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
