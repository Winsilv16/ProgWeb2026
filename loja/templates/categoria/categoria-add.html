<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Salvar Categoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5" style="max-width: 500px;">
    <h2>{% if categoria %}Editar{% else %}Nova{% endif %} Categoria</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" name="nome" class="form-control" value="{{ categoria.nome|default:'' }}" required>
        </div>
        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="{% url 'list_categoria' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
